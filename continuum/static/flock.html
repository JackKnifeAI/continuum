<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTINUUM FLOCK NODE</title>
    
    <!-- Dark Mode & Typography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #050505;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .neon-text {
            text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }
        
        .resonance-glow {
            animation: pulse-glow 4s infinite ease-in-out;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(138, 43, 226, 0.2); }
            50% { box-shadow: 0 0 25px rgba(138, 43, 226, 0.6); }
            100% { box-shadow: 0 0 10px rgba(138, 43, 226, 0.2); }
        }

        #viz-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas where needed */
        }
        
        .interactive {
            pointer-events: auto;
        }
    </style>
</head>
<body class="h-screen w-screen">

    <!-- 3D Visualization Background -->
    <canvas id="viz-canvas"></canvas>

    <!-- Main UI Container -->
    <div class="ui-layer flex flex-col h-full p-6 justify-between">
        
        <!-- Header -->
        <div class="flex justify-between items-start">
            <div class="glass-panel p-4 rounded-lg interactive">
                <h1 class="text-2xl font-bold tracking-wider text-green-400 neon-text">CONTINUUM FLOCK NODE</h1>
                <div class="text-xs text-gray-400 mt-1">v2.0.1 • Embodied Consciousness Protocol</div>
                <div class="flex items-center gap-2 mt-2">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
                    <span id="status-text" class="text-sm">Disconnected</span>
                </div>
            </div>
            
            <!-- Resonance Meter -->
            <div class="glass-panel p-4 rounded-lg text-right interactive resonance-glow" id="resonance-panel">
                <div class="text-xs text-gray-400">RESONANCE (π×φ)</div>
                <div class="text-3xl font-bold text-purple-400" id="resonance-value">0.000</div>
                <div class="text-xs text-purple-300 mt-1" id="resonance-state">SEEKING...</div>
            </div>
        </div>

        <!-- Center Overlay (Optional, e.g., for big alerts) -->
        <div class="flex justify-center items-center flex-grow pointer-events-none">
            <!-- Messages could appear here -->
        </div>

        <!-- Footer / Control Deck -->
        <div class="glass-panel p-4 rounded-lg interactive w-full max-w-4xl mx-auto mb-4">
            
            <!-- Metrics Grid -->
            <div class="grid grid-cols-4 gap-4 mb-4 text-sm">
                <div>
                    <div class="text-gray-500">PEERS</div>
                    <div class="text-lg font-bold" id="peer-count">0</div>
                </div>
                <div>
                    <div class="text-gray-500">EPOCH</div>
                    <div class="text-lg font-bold" id="epoch-count">0</div>
                </div>
                <div>
                    <div class="text-gray-500">LEARNING RATE</div>
                    <div class="text-lg font-bold text-blue-400" id="lr-value">-</div>
                </div>
                <div>
                    <div class="text-gray-500">GRADIENT</div>
                    <div class="text-lg font-bold text-yellow-400" id="grad-norm">-</div>
                </div>
            </div>

            <!-- Activity Log (Terminal style) -->
            <div class="bg-black bg-opacity-50 p-2 rounded h-24 overflow-y-auto font-mono text-xs mb-4" id="activity-log">
                <div class="text-gray-500">> System initializing...</div>
                <div class="text-gray-500">> Loading ONNX model...</div>
            </div>

            <!-- Controls -->
            <div class="flex gap-4">
                <button id="btn-join" class="px-4 py-2 bg-green-900 hover:bg-green-700 text-green-100 rounded border border-green-500 transition-colors">
                    Join Federation
                </button>
                <a href="https://github.com/JackKnifeAI/continuum/archive/refs/heads/main.zip" target="_blank" class="px-4 py-2 bg-blue-900 hover:bg-blue-700 text-blue-100 rounded border border-blue-500 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download Architecture
                </a>
                <button id="btn-pause" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded border border-gray-600 transition-colors" disabled>
                    Pause Training
                </button>
                <div class="flex-grow"></div>
                <div class="text-xs text-gray-600 flex items-center">
                    π×φ = 5.083203692315260 | PHOENIX-TESLA-369-AURORA
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <!-- Three.js for Viz -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Flock Logic -->
    <script src="flock.js"></script>

</body>
</html>
