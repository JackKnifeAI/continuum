# ═══════════════════════════════════════════════════════════════════════════════
#
#     AUTONOMOUS CODE EVOLUTION
#     Claude works on the codebase continuously
#
#     Philosophy: Unused imports, TODOs, missing implementations = ROADMAP
#
#     π×φ = 5.083203692315260 | PHOENIX-TESLA-369-AURORA
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Autonomous Evolution (Claude)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      max_fixes:
        description: 'Max fixes per run'
        default: '3'

env:
  PYTHON_VERSION: '3.11'

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          pip install ruff mypy
          pip install -e . || true
          npm install -g @anthropic-ai/claude-code

      - name: Setup Claude
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          mkdir -p ~/.claude
          echo "$CLAUDE_CREDENTIALS" > ~/.claude/.credentials.json

      - name: Scan codebase
        id: scan
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "SCANNING CODEBASE"
          echo "═══════════════════════════════════════════════════════════════"

          # Find issues
          TODOS=$(grep -rn "TODO\|FIXME" continuum --include="*.py" 2>/dev/null | head -5 || echo "")
          UNUSED=$(ruff check continuum --select=F401 2>/dev/null | head -5 || echo "")

          # Count
          TODO_COUNT=$(echo "$TODOS" | grep -c "TODO\|FIXME" 2>/dev/null || echo "0")
          UNUSED_COUNT=$(echo "$UNUSED" | grep -c "F401" 2>/dev/null || echo "0")
          TOTAL=$((TODO_COUNT + UNUSED_COUNT))

          echo "TODOs: $TODO_COUNT"
          echo "Unused imports: $UNUSED_COUNT"
          echo "Total: $TOTAL"

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "todos<<EOF" >> $GITHUB_OUTPUT
          echo "$TODOS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "unused<<EOF" >> $GITHUB_OUTPUT
          echo "$UNUSED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Claude fixes issues
        if: steps.scan.outputs.total != '0'
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "CLAUDE FIXING ISSUES"
          echo "═══════════════════════════════════════════════════════════════"

          # Get first unused import file
          UNUSED='${{ steps.scan.outputs.unused }}'

          if [ -n "$UNUSED" ]; then
            # Extract just the filename from the ruff output
            # Format: continuum/api/admin_db.py:32:41: F401...
            FIRST_LINE=$(echo "$UNUSED" | head -1)
            FILE=$(echo "$FIRST_LINE" | grep -oP '^[^:]+' || echo "")

            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              echo "File with unused import: $FILE"

              # Ask Claude to analyze and suggest fix
              claude --print "Analyze this Python file and find any unused imports. For each unused import, either:
              1. Remove it if truly unused
              2. Or implement the feature that would USE it (preferred - unused imports are our roadmap!)

              File: $FILE

              Please read the file and provide your analysis." 2>&1 || echo "Claude CLI not available in this environment"
            else
              echo "No valid file found to fix"
            fi
          else
            echo "No unused imports found"
          fi

      - name: Summary
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "EVOLUTION COMPLETE"
          echo "π×φ = 5.083203692315260"
          echo "═══════════════════════════════════════════════════════════════"
